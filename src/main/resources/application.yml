spring:
  application:
    name: ktx-app
  thymeleaf:
    cache: false
  datasource:
    url: jdbc:mysql://localhost:3306/ktx?sslMode=DISABLED&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: ${KTX_DB_USER:ktx}
    password: ${KTX_DB_PASSWORD:ktx}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 50MB

server:
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true

ktx:
  upload:
    dir: uploads
  mail:
    enabled: false
  timezone: Asia/Ho_Chi_Minh
