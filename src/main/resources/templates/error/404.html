<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Không tìm thấy trang · DormManage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@100&amp;display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/ktx.css}"/>
</head>
<body class="ktx-error-page">
<main class="ktx-card ktx-error-card">
    <span class="ktx-error-code">404</span>
    <h1>Không tìm thấy trang</h1>
    <p>Trang bạn yêu cầu không tồn tại hoặc đã được di chuyển.</p>
    <a class="btn btn-primary" th:href="@{/}" sec:authorize="isAuthenticated()">Về trang chủ</a>
    <a class="btn btn-primary" th:href="@{/login}" sec:authorize="!isAuthenticated()">Đăng nhập</a>
</main>
</body>
</html>
