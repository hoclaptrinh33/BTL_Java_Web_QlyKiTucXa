<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main :: layout(~{::content})}">
<body>
<main th:fragment="content">
    <section class="ktx-card mb-4">
        <h2 class="h5 mb-2">Điểm rèn luyện hiện tại</h2>
        <p class="mb-0">
            <strong th:text="${student.conductScore != null ? student.conductScore : 0}">100</strong> điểm
        </p>
        <div class="alert alert-warning mt-3 mb-0" th:if="${isWarning}">
            Điểm rèn luyện dưới ngưỡng cảnh cáo (<span th:text="${warnThreshold}">50</span> điểm).
        </div>
        <div class="alert alert-danger mt-3 mb-0" th:if="${student.blockedFromHousing}">
            Bạn đang bị chặn nộp đơn đăng ký chỗ ở mới.
        </div>
    </section>

    <section class="ktx-card p-0">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0 ktx-table">
                <thead>
                <tr>
                    <th>Thời điểm</th>
                    <th>Loại vi phạm</th>
                    <th>Severity</th>
                    <th class="text-end">Điểm trừ</th>
                    <th>Action</th>
                    <th>Mô tả</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(violations)}">
                    <td colspan="6" class="text-center text-muted py-4">Chưa có biên bản vi phạm.</td>
                </tr>
                <tr th:each="v : ${violations}">
                    <td th:text="${#temporals.format(v.occurredAt, 'dd/MM/yyyy HH:mm')}">01/01/2026 08:00</td>
                    <td th:text="${v.violationType.name()}">LATE_RETURN</td>
                    <td th:text="${v.severity.name()}">MINOR</td>
                    <td class="text-end" th:text="${v.pointsDeducted}">5</td>
                    <td th:text="${v.action.name()}">WARNING</td>
                    <td th:text="${v.description != null && !#strings.isEmpty(v.description) ? v.description : '—'}">—</td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
</body>
</html>
