<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main :: layout(~{::content})}">
<body>
<main th:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <section class="ktx-card">
                <h2 class="h5 mb-4">Thay đổi mật khẩu tài khoản</h2>
                <form th:action="@{/student/password}" th:object="${passwordForm}" method="post">
                    <div class="mb-3">
                        <label for="currentPassword" class="form-label fw-semibold">Mật khẩu hiện tại</label>
                        <input type="password" class="form-control" id="currentPassword" th:field="*{currentPassword}"
                               th:classappend="${#fields.hasErrors('currentPassword')} ? 'is-invalid'" placeholder="Nhập mật khẩu hiện tại"/>
                        <div class="invalid-feedback" th:errors="*{currentPassword}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="newPassword" class="form-label fw-semibold">Mật khẩu mới</label>
                        <input type="password" class="form-control" id="newPassword" th:field="*{newPassword}"
                               th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'" placeholder="Mật khẩu mới (tối thiểu 8 ký tự)"/>
                        <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                    </div>

                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label fw-semibold">Xác nhận mật khẩu mới</label>
                        <input type="password" class="form-control" id="confirmPassword" th:field="*{confirmPassword}"
                               th:classappend="${#fields.hasErrors('confirmPassword')} ? 'is-invalid'" placeholder="Nhập lại mật khẩu mới"/>
                        <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
                    </div>

                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary px-4">Đổi mật khẩu</button>
                    </div>
                </form>
            </section>
        </div>
    </div>
</main>
</body>
</html>
