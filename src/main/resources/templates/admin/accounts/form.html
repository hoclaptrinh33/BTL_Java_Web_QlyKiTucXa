<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/main :: layout(~{::content})}">
<body>
<main th:fragment="content" class="container-fluid py-4" style="max-width: 720px;">

    <div class="mb-4">
        <a th:href="@{/admin/accounts}" class="btn btn-sm btn-outline-secondary rounded-circle mb-2" title="Quay lại">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="h4 fw-bold text-dark mb-1">Thêm tài khoản Quản trị viên hệ thống</h2>
        <p class="text-secondary small mb-0">Tài khoản này chỉ có quyền cấu hình hệ thống (SYSTEM) và quản lý tài khoản admin</p>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <div class="card border-0 shadow-sm p-4">
        <form th:action="@{/admin/accounts}" th:object="${accountForm}" method="post">
            <div class="mb-3">
                <label for="username" class="form-label fw-semibold text-secondary small">Tên đăng nhập <span class="text-danger">*</span></label>
                <input type="text" id="username" th:field="*{username}" class="form-control"
                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'" placeholder="Ví dụ: sysadmin2" required/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Lỗi</div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-semibold text-secondary small">Email <span class="text-danger">*</span></label>
                <input type="email" id="email" th:field="*{email}" class="form-control"
                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'" placeholder="Ví dụ: admin2@example.com" required/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Lỗi</div>
            </div>

            <div class="mb-3">
                <label for="fullName" class="form-label fw-semibold text-secondary small">Họ và tên</label>
                <input type="text" id="fullName" th:field="*{fullName}" class="form-control"
                       th:classappend="${#fields.hasErrors('fullName')} ? 'is-invalid'" placeholder="Ví dụ: Quản trị viên 2"/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}">Lỗi</div>
            </div>

            <div class="mb-3">
                <label for="phone" class="form-label fw-semibold text-secondary small">Số điện thoại</label>
                <input type="text" id="phone" th:field="*{phone}" class="form-control"
                       th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'" placeholder="Ví dụ: 0912345678"/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}">Lỗi</div>
            </div>

            <div class="mb-4">
                <label for="password" class="form-label fw-semibold text-secondary small">Mật khẩu ban đầu <span class="text-danger">*</span></label>
                <input type="password" id="password" th:field="*{password}" class="form-control"
                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'" placeholder="Tối thiểu 8 ký tự" required minlength="8"/>
                <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Lỗi</div>
            </div>

            <div class="form-check form-switch mb-4">
                <input class="form-check-input" type="checkbox" id="enabled" th:field="*{enabled}"/>
                <label class="form-check-label fw-semibold text-secondary small" for="enabled">Kích hoạt tài khoản ngay</label>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/admin/accounts}" class="btn btn-outline-secondary">Hủy bỏ</a>
                <button type="submit" class="btn btn-primary px-4">
                    <i class="bi bi-check-lg me-1"></i> Lưu tài khoản
                </button>
            </div>
        </form>
    </div>

</main>
</body>
</html>
