<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main :: layout(~{::content})}">
<body>
<main th:fragment="content">
    <section class="ktx-card" style="max-width: 640px;">
        <form th:action="${buildingId == null} ? @{/admin/buildings} : @{/admin/buildings/{id}/edit(id=${buildingId})}"
              th:object="${form}" method="post" novalidate>
            <div class="mb-3">
                <label class="form-label" for="code">Mã tòa</label>
                <input class="form-control" id="code" th:field="*{code}"
                       th:classappend="${#fields.hasErrors('code')} ? 'is-invalid'"
                       maxlength="10" placeholder="A"/>
                <div class="form-text">Chữ và số, tối đa 10 ký tự. Sẽ lưu hoa (A, B, C…).</div>
                <div class="invalid-feedback" th:errors="*{code}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="name">Tên tòa</label>
                <input class="form-control" id="name" th:field="*{name}"
                       th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                       maxlength="120" placeholder="Tòa A — Nam"/>
                <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label" for="genderPolicy">Giới tính tòa</label>
                <select class="form-select" id="genderPolicy" th:field="*{genderPolicy}"
                        th:classappend="${#fields.hasErrors('genderPolicy')} ? 'is-invalid'">
                    <option value="">— Chọn —</option>
                    <option th:each="g : ${genderPolicies}" th:value="${g}"
                            th:text="${g.name() == 'MALE'} ? 'Nam' : 'Nữ'">Nam</option>
                </select>
                <div class="form-text" th:if="${occupying}">
                    Tòa còn hợp đồng đang giữ giường — không đổi Nam/Nữ.
                </div>
                <div class="invalid-feedback" th:errors="*{genderPolicy}"></div>
            </div>

            <div class="form-check mb-4">
                <input class="form-check-input" type="checkbox" id="active" th:field="*{active}"/>
                <label class="form-check-label" for="active">Đang dùng (bỏ chọn = tạm tắt)</label>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary"
                        th:text="${buildingId == null} ? 'Tạo tòa' : 'Lưu thay đổi'">Tạo tòa</button>
                <a class="btn btn-outline-secondary" th:href="@{/admin/buildings}">Hủy</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
