<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout (content)" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle} + ' · DormManage'">DormManage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/ktx.css}"/>
</head>
<body>
<div class="ktx-shell" sec:authorize="hasAnyRole('ADMIN','STAFF')">
    <aside class="ktx-sidebar d-none d-lg-flex">
        <div th:replace="~{fragments/sidebar :: inner}"></div>
    </aside>
    <div class="offcanvas offcanvas-start ktx-offcanvas d-lg-none" tabindex="-1" id="ktxSidebar">
        <div class="offcanvas-body p-0">
            <div th:replace="~{fragments/sidebar :: inner}"></div>
        </div>
    </div>
    <div class="ktx-workspace">
        <header th:replace="~{fragments/navbar :: navbar}"></header>
        <div class="ktx-content">
            <div th:replace="~{fragments/alerts :: alerts}"></div>
            <div th:replace="${content}"></div>
        </div>
    </div>
</div>
<div class="ktx-portal" sec:authorize="hasRole('STUDENT')">
    <header th:replace="~{fragments/navbar :: navbar-student}"></header>
    <div class="ktx-portal-body">
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <div th:replace="${content}"></div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
