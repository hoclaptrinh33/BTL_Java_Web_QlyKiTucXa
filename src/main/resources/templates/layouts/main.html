<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout (content)" lang="vi">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle} + ' · DormManage'">DormManage</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.min.css"/>
    <link rel="stylesheet" th:href="@{/css/ktx.css}"/>
</head>
<body>
<div th:replace="~{fragments/alerts :: alerts}"></div>
<div class="ktx-shell" sec:authorize="hasAnyRole('ADMIN','STAFF')">
    <aside class="ktx-sidebar d-none d-lg-flex">
        <div th:replace="~{fragments/sidebar :: inner}"></div>
    </aside>
    <div class="offcanvas offcanvas-start ktx-offcanvas d-lg-none" tabindex="-1" id="ktxSidebar">
        <div class="offcanvas-body p-0">
            <div th:replace="~{fragments/sidebar :: inner}"></div>
        </div>
    </div>
    <div class="ktx-workspace">
        <header th:replace="~{fragments/navbar :: navbar}"></header>
        <div class="ktx-content">
            <div th:replace="${content}"></div>
        </div>
    </div>
</div>
<div class="ktx-portal" sec:authorize="hasRole('STUDENT')">
    <header th:replace="~{fragments/navbar :: navbar-student}"></header>
    <main class="ktx-portal-main">
        <div class="container-xl py-4">
            <div th:replace="${content}"></div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.12.4/dist/sweetalert2.all.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Intercept form submissions that have data-confirm
    document.addEventListener('submit', function(e) {
        const form = e.target;
        if (form.hasAttribute('data-confirm') && !form.dataset.confirmed) {
            e.preventDefault();
            const message = form.getAttribute('data-confirm');
            const title = form.getAttribute('data-confirm-title') || 'Xác nhận';
            const type = form.getAttribute('data-confirm-type') || 'warning'; // warning, danger, success, info
            const confirmText = form.getAttribute('data-confirm-button') || 'Đồng ý';
            const cancelText = form.getAttribute('data-cancel-button') || 'Hủy bỏ';

            let confirmColor = '#6D5EF5'; // Violet
            if (type === 'danger') {
                confirmColor = '#F43F5E'; // Rose
            } else if (type === 'success') {
                confirmColor = '#22C55E'; // Mint
            } else if (type === 'warning') {
                confirmColor = '#F97316'; // Peach
            }

            Swal.fire({
                title: title,
                text: message,
                icon: type,
                showCancelButton: true,
                confirmButtonColor: confirmColor,
                cancelButtonColor: '#64748B', // Muted
                confirmButtonText: confirmText,
                cancelButtonText: cancelText,
                reverseButtons: true,
                customClass: {
                    popup: 'swal2-ktx-popup',
                    title: 'swal2-ktx-title',
                    htmlContainer: 'swal2-ktx-text'
                }
            }).then((result) => {
                if (result.isConfirmed) {
                    form.dataset.confirmed = 'true';
                    form.submit();
                }
            });
        }
    });

    // Quản lý Toast thông báo nổi (Floating Toast Notification Overlay)
    function setupKtxToasts() {
        const toasts = document.querySelectorAll('.ktx-toast');
        toasts.forEach(function(toast) {
            if (toast.dataset.initialized) return;
            toast.dataset.initialized = 'true';

            let dismissTimeout;
            let startTime = Date.now();
            let remaining = 3000;

            function dismiss() {
                if (toast.dataset.dismissing) return;
                toast.dataset.dismissing = 'true';
                toast.classList.add('is-hiding');
                setTimeout(function() {
                    toast.remove();
                }, 350);
            }

            function startTimer() {
                startTime = Date.now();
                dismissTimeout = setTimeout(dismiss, remaining);
            }

            function pauseTimer() {
                clearTimeout(dismissTimeout);
                remaining -= (Date.now() - startTime);
                const bar = toast.querySelector('.ktx-toast-progress');
                if (bar) bar.style.animationPlayState = 'paused';
            }

            function resumeTimer() {
                if (remaining <= 0) {
                    dismiss();
                    return;
                }
                startTime = Date.now();
                dismissTimeout = setTimeout(dismiss, remaining);
                const bar = toast.querySelector('.ktx-toast-progress');
                if (bar) bar.style.animationPlayState = 'running';
            }

            // Bắt đầu đếm ngược tự đóng sau 3 giây
            startTimer();

            // Hover vào thì dừng đếm, rời chuột ra thì tiếp tục
            toast.addEventListener('mouseenter', pauseTimer);
            toast.addEventListener('mouseleave', resumeTimer);

            // Nút đóng ngay lập tức
            const closeBtn = toast.querySelector('.ktx-toast-close');
            if (closeBtn) {
                closeBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    clearTimeout(dismissTimeout);
                    dismiss();
                });
            }
        });
    }

    setupKtxToasts();

    // Hỗ trợ hiển thị Toast động từ Javascript nếu cần
    window.showKtxToast = function(message, type = 'success', title = '') {
        let container = document.getElementById('ktxGlobalAlerts');
        if (!container) {
            container = document.createElement('div');
            container.id = 'ktxGlobalAlerts';
            container.className = 'ktx-toast-container';
            document.body.prepend(container);
        }

        const iconMap = {
            success: 'bi-check-circle-fill',
            danger: 'bi-exclamation-circle-fill',
            error: 'bi-exclamation-circle-fill',
            warning: 'bi-exclamation-triangle-fill',
            info: 'bi-info-circle-fill'
        };

        const titleMap = {
            success: 'Thành công',
            danger: 'Lỗi thao tác',
            error: 'Lỗi thao tác',
            warning: 'Cảnh báo',
            info: 'Thông báo'
        };

        const resolvedType = type === 'error' ? 'danger' : type;
        const icon = iconMap[resolvedType] || 'bi-info-circle-fill';
        const displayTitle = title || titleMap[resolvedType] || 'Thông báo';

        const toast = document.createElement('div');
        toast.className = 'ktx-toast ktx-toast--' + resolvedType;
        toast.setAttribute('role', resolvedType === 'danger' ? 'alert' : 'status');
        toast.innerHTML = `
            <div class="ktx-toast-icon"><i class="bi ${icon}"></i></div>
            <div class="ktx-toast-body">
                <div class="ktx-toast-title">${displayTitle}</div>
                <div class="ktx-toast-text">${message}</div>
            </div>
            <button type="button" class="ktx-toast-close" aria-label="Đóng">
                <i class="bi bi-x-lg"></i>
            </button>
            <div class="ktx-toast-progress"></div>
        `;

        container.appendChild(toast);
        setupKtxToasts();
    };
});
</script>
</body>
</html>
